# Docker Desktop only; disposable Kafka data and deliberately fake credentials.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-connect-healer-e2e
  labels:
    app.kubernetes.io/part-of: kafka-connect-healer-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-worker
  namespace: kafka-connect-healer-e2e
data:
  worker.properties: |
    bootstrap.servers=broker:9092
    group.id=healer-e2e-connect
    config.storage.topic=healer-e2e-configs
    offset.storage.topic=healer-e2e-offsets
    status.storage.topic=healer-e2e-status
    config.storage.replication.factor=1
    offset.storage.replication.factor=1
    status.storage.replication.factor=1
    offset.storage.partitions=1
    status.storage.partitions=1
    key.converter=org.apache.kafka.connect.storage.StringConverter
    value.converter=org.apache.kafka.connect.storage.StringConverter
    plugin.path=/opt/kafka/plugins
    plugin.discovery=only_scan
    listeners=http://0.0.0.0:8083,https://0.0.0.0:8443
    rest.advertised.host.name=connect
    rest.advertised.port=8083
    rest.advertised.listener=http
    rest.extension.classes=org.apache.kafka.connect.rest.basic.auth.extension.BasicAuthSecurityRestExtension
    listeners.https.ssl.keystore.location=/opt/kafka/e2e-tls/connect.p12
    listeners.https.ssl.keystore.password=test-only-password
    listeners.https.ssl.keystore.type=PKCS12
    listeners.https.ssl.key.password=test-only-password
    offset.flush.interval.ms=1000
  jaas.conf: |
    KafkaConnect {
      org.apache.kafka.connect.rest.basic.auth.extension.PropertyFileLoginModule required
      file="/config/credentials.properties";
    };
  credentials.properties: |
    connect-test=connect-test-only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healer-config
  namespace: kafka-connect-healer-e2e
data:
  application.yaml: |
    pollingBehavior:
      interval: 1s
      restartFailedTasks: false
      backoff:
        enabled: true
        baseDelay: 2s
        maxDelay: 4s
        exponential: true
    communicationConfig:
      requestTimeout: 3s
    apiConfig:
      authConfig:
        enabled: true
        username: healer-test
        password: healer-test-only
    loggingConfig:
      level: DEBUG
  connect-clusters.yaml: |
    test:
      host: connect
      port: "8443"
      https: true
      authConfig:
        enabled: true
        username: connect-test
        password: connect-test-only
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: kafka-connect-healer-e2e
spec:
  publishNotReadyAddresses: true
  selector:
    app: broker
  ports:
    - port: 9092
      name: kafka
    - port: 9093
      name: controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: kafka-connect-healer-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
        - name: broker
          image: apache/kafka:4.2.2
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://broker:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@broker:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Let Connect's AdminClient create compacted internal topics, even
            # after this disposable broker loses its data during an outage test.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: connect
  namespace: kafka-connect-healer-e2e
spec:
  selector:
    app: connect
  ports:
    - port: 8083
      name: http
    - port: 8443
      name: https
    - port: 8444
      name: fault-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect
  namespace: kafka-connect-healer-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: connect
  template:
    metadata:
      labels:
        app: connect
      annotations:
        kubectl.kubernetes.io/default-container: connect
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: fault-gateway
          image: kafka-connect-healer-connect:e2e
          imagePullPolicy: Never
          command: [java, -Xmx96m, -cp, /opt/kafka/plugins/healer-test/healer-test.jar, e2e.FaultProxy]
          resources:
            requests:
              memory: 96Mi
              cpu: 25m
            limits:
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: connect
          image: kafka-connect-healer-connect:e2e
          imagePullPolicy: Never
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
            - name: KAFKA_OPTS
              value: -Djava.security.auth.login.config=/config/jaas.conf
          ports:
            - containerPort: 8083
            - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: connect-worker
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: connect-secondary
  namespace: kafka-connect-healer-e2e
spec:
  selector:
    app: connect-secondary
  ports:
    - port: 8443
      name: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect-secondary
  namespace: kafka-connect-healer-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: connect-secondary
  template:
    metadata:
      labels:
        app: connect-secondary
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: connect
          image: kafka-connect-healer-connect:e2e
          imagePullPolicy: Never
          command: [sh, -c]
          args:
            - |
              sed 's/healer-e2e-/healer-e2e-secondary-/g; s/rest.advertised.host.name=connect$/rest.advertised.host.name=connect-secondary/' /config/worker.properties > /tmp/worker.properties
              exec /opt/kafka/bin/connect-distributed.sh /tmp/worker.properties
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
            - name: KAFKA_OPTS
              value: -Djava.security.auth.login.config=/config/jaas.conf
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: connect-worker
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: healer
  namespace: kafka-connect-healer-e2e
spec:
  selector:
    app: healer
  ports:
    - port: 8080
      name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  namespace: kafka-connect-healer-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healer
  template:
    metadata:
      labels:
        app: healer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        - name: trust-test-certificate
          image: kafka-connect-healer-connect:e2e
          imagePullPolicy: Never
          command: [sh, -c, "cp /opt/kafka/e2e-tls/ca.crt /trust/ca.crt"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: trust
              mountPath: /trust
      containers:
        - name: healer
          image: kafka-connect-healer:e2e
          imagePullPolicy: Never
          args:
            - --config=/config/application.yaml
            - --connect-clusters=/config/connect-clusters.yaml
          env:
            - name: SSL_CERT_FILE
              value: /trust/ca.crt
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: trust
              mountPath: /trust
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: healer-config
        - name: trust
          emptyDir: {}
