# No Service or Ingress is included: access the API using kubectl port-forward.
# Enable Basic Auth with a Secret overlay before exposing the API to other users.
pollingBehavior:
  interval: 10s
  restartFailedTasks: true
  backoff:
    enabled: true
    baseDelay: 20s
    maxDelay: 10m
    exponential: true
communicationConfig:
  requestTimeout: 10s
apiConfig:
  authConfig:
    enabled: false
loggingConfig:
  level: INFO
